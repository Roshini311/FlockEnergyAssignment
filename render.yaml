services:
  - type: web
    name: flock-energy-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: URJA_BASE_URL
        value: https://urja-ops.flockenergy.tech
      - key: URJA_USERNAME
        sync: false
      - key: URJA_PASSWORD
        sync: false
      - key: REQUEST_TIMEOUT
        value: "10.0"
